---
# Página da Impressora 3D — arco de progresso, status, temperaturas,
# ETA + consumo, e controles pausar/retomar/cancelar.
# Power no topo liga/desliga a tomada da impressora.
#
# vars (entidades da integração da sua impressora):
#   page_id          página de volta (default main_page)
#   power_switch     switch da tomada
#   state_sensor     sensor de estado do print
#   progress_sensor  sensor de progresso (0-100)
#   eta_sensor       sensor de ETA (timestamp)
#   watts_sensor     sensor de consumo (W)
#   ext_temp / ext_target   extrusora atual/alvo
#   bed_temp / bed_target   mesa atual/alvo
#   pause_button / resume_button / cancel_button   entidades button.*

globals:
- id: printer_is_on
  type: bool
  initial_value: 'false'
- id: printer_watts
  type: float
  initial_value: '0.0'
- id: printer_eta
  type: std::string
  initial_value: '""'
- id: printer_ext_temp
  type: float
  initial_value: '0.0'
- id: printer_ext_target
  type: float
  initial_value: '0.0'
- id: printer_bed_temp
  type: float
  initial_value: '0.0'
- id: printer_bed_target
  type: float
  initial_value: '0.0'

lvgl:
  pages:
  - id: printer_page
    styles: page_style
    skip: true
    pad_all: 12
    layout:
      type: FLEX
      flex_flow: COLUMN
      flex_align_cross: CENTER
    widgets:
    # ── barra de topo ────────────────────────────────────────────────────────
    - obj:
        width: 100%
        height: 56
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollable: false
        scrollbar_mode: "OFF"
        widgets:
        - button:
            id: printer_btn_back
            align: LEFT_MID
            width: 50
            height: 50
            radius: 25
            bg_color: $tile_off_bg
            pad_all: 0
            on_short_click:
              then:
              - lvgl.page.show:
                  id: ${page_id | default("main_page")}
                  animation: OUT_RIGHT
                  time: 150ms
            widgets:
            - label:
                align: CENTER
                text_font: mdi_icons_28
                text_color: $tile_off_icon
                text: $mdi_chevron_left
        - label:
            align: CENTER
            text_font: $tile_name_font
            text_color: $tile_off_status
            text: "Impressora 3D"
        - button:
            id: printer_btn_power
            align: RIGHT_MID
            # deslocado à esquerda: o canto direito é do relógio do top_layer
            x: -80
            width: 50
            height: 50
            radius: 25
            bg_color: $tile_off_bg
            pad_all: 0
            on_short_click:
              then:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${power_switch}
            widgets:
            - label:
                id: printer_power_icon
                align: CENTER
                text_font: mdi_icons_28
                text_color: $tile_off_icon
                text: $mdi_power
    # ── corpo ────────────────────────────────────────────────────────────────
    - obj:
        width: 100%
        flex_grow: 1
        bg_opa: TRANSP
        border_width: 0
        scrollable: false
        scrollbar_mode: "OFF"
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: CENTER
          flex_align_cross: CENTER
          pad_row: 10
        widgets:
        # arco de progresso com % dentro
        - arc:
            id: printer_arc
            width: 175
            height: 175
            arc_width: 14
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_color: $tile_off_bg
            indicator:
              arc_color: $tile_on_bg
              arc_width: 14
            knob:
              bg_opa: TRANSP
            widgets:
            - label:
                id: printer_pct_label
                align: CENTER
                text_font: nunito_42
                text_color: $tile_off_name
                text: "--%"
        - label:
            id: printer_status_label
            width: 100%
            text_align: CENTER
            text_font: $tile_name_font
            text_color: $tile_off_status
            text: "..."
        # temperaturas: extrusora + mesa
        - obj:
            width: 100%
            height: 64
            bg_opa: TRANSP
            border_width: 0
            pad_left: 4
            pad_right: 4
            pad_top: 0
            pad_bottom: 0
            scrollable: false
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
              pad_column: 8
            widgets:
            - obj:
                id: printer_chip_ext
                flex_grow: 1
                height: 60
                radius: 16
                bg_color: $tile_off_bg
                border_width: 0
                pad_all: 0
                scrollable: false
                scrollbar_mode: "OFF"
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  pad_row: 1
                widgets:
                - label:
                    width: 100%
                    text_align: CENTER
                    text_font: $tile_status_font
                    text_color: $tile_off_status
                    text: "Extrusora"
                - label:
                    id: printer_ext_label
                    width: 100%
                    text_align: CENTER
                    text_font: $tile_name_font
                    text_color: $tile_off_name
                    text: "--° / --°"
            - obj:
                id: printer_chip_bed
                flex_grow: 1
                height: 60
                radius: 16
                bg_color: $tile_off_bg
                border_width: 0
                pad_all: 0
                scrollable: false
                scrollbar_mode: "OFF"
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  pad_row: 1
                widgets:
                - label:
                    width: 100%
                    text_align: CENTER
                    text_font: $tile_status_font
                    text_color: $tile_off_status
                    text: "Mesa"
                - label:
                    id: printer_bed_label
                    width: 100%
                    text_align: CENTER
                    text_font: $tile_name_font
                    text_color: $tile_off_name
                    text: "--° / --°"
        # ETA + consumo
        - label:
            id: printer_info_label
            width: 100%
            text_align: CENTER
            text_font: $tile_status_font
            text_color: $tile_off_status
            text: ""
        # controles
        - obj:
            width: 100%
            height: 66
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 24
            widgets:
            - button:
                id: printer_btn_pause
                width: 60
                height: 60
                radius: 30
                bg_color: $tile_off_bg
                pad_all: 0
                on_short_click:
                  then:
                  - homeassistant.action:
                      action: button.press
                      data:
                        entity_id: ${pause_button}
                widgets:
                - label:
                    align: CENTER
                    text_font: mdi_icons_24
                    text_color: 0xF4A900
                    text: $mdi_pause
            - button:
                id: printer_btn_resume
                width: 60
                height: 60
                radius: 30
                bg_color: $tile_off_bg
                pad_all: 0
                on_short_click:
                  then:
                  - homeassistant.action:
                      action: button.press
                      data:
                        entity_id: ${resume_button}
                widgets:
                - label:
                    align: CENTER
                    text_font: mdi_icons_24
                    text_color: 0x5CA848
                    text: $mdi_play
            - button:
                id: printer_btn_cancel
                width: 60
                height: 60
                radius: 30
                bg_color: $tile_off_bg
                pad_all: 0
                on_short_click:
                  then:
                  - homeassistant.action:
                      action: button.press
                      data:
                        entity_id: ${cancel_button}
                widgets:
                - label:
                    align: CENTER
                    text_font: mdi_icons_24
                    text_color: 0xE24B4A
                    text: $mdi_stop

# ── Estado vindo do HA ─────────────────────────────────────────────────────────
binary_sensor:
- platform: homeassistant
  id: printer_ha_power
  entity_id: ${power_switch}
  trigger_on_initial_state: true
  on_state:
  - lambda: |-
      id(printer_is_on) = x;
      lv_obj_set_style_bg_color(id(printer_btn_power),
        lv_color_hex(x ? ${tile_on_bg} : ${tile_off_bg}), 0);
      lv_obj_set_style_text_color(id(printer_power_icon),
        lv_color_hex(x ? ${tile_on_fg} : ${tile_off_icon}), 0);

text_sensor:
- platform: homeassistant
  id: printer_ha_state
  entity_id: ${state_sensor}
  on_value:
  - lambda: |-
      std::string s = x;
      std::string label;
      uint32_t col = ${tile_off_status};
      if (s == "printing")        { label = "Imprimindo"; col = ${tile_on_bg}; }
      else if (s == "paused")     { label = "Pausada"; col = 0xF4A900; }
      else if (s == "complete")   { label = "Concluída"; col = 0x5CA848; }
      else if (s == "standby")    { label = "Em espera"; }
      else if (s == "cancelled")  { label = "Cancelada"; }
      else if (s == "error")      { label = "Erro"; col = 0xE24B4A; }
      else if (s == "unavailable" || s == "unknown") { label = "Desligada"; }
      else                        { label = s; }
      lv_label_set_text(id(printer_status_label), label.c_str());
      lv_obj_set_style_text_color(id(printer_status_label), lv_color_hex(col), 0);

- platform: homeassistant
  id: printer_ha_eta
  entity_id: ${eta_sensor}
  on_value:
  - lambda: |-
      // Timestamp ISO em UTC → hora local (America/Sao_Paulo, UTC-3)
      std::string s = x;
      if (s.size() >= 16 && s[10] == 'T') {
        int hh = atoi(s.substr(11, 2).c_str());
        int mm = atoi(s.substr(14, 2).c_str());
        hh = (hh + 24 - 3) % 24;
        id(printer_eta) = str_sprintf("%02d:%02d", hh, mm);
      } else if (s == "unavailable" || s == "unknown" || s.empty()) {
        id(printer_eta) = "";
      } else {
        id(printer_eta) = s;
      }
  - script.execute: printer_update_info

sensor:
- platform: homeassistant
  id: printer_ha_progress
  entity_id: ${progress_sensor}
  on_value:
  - lambda: |-
      if (std::isnan(x)) return;
      lv_label_set_text(id(printer_pct_label),
        str_sprintf("%.0f%%", x).c_str());
  - lvgl.arc.update:
      id: printer_arc
      value: !lambda 'return (int)x;'

- platform: homeassistant
  id: printer_ha_watts
  entity_id: ${watts_sensor}
  on_value:
  - lambda: if (!std::isnan(x)) id(printer_watts) = x;
  - script.execute: printer_update_info

- platform: homeassistant
  id: printer_ha_ext_temp
  entity_id: ${ext_temp}
  on_value:
  - lambda: if (!std::isnan(x)) id(printer_ext_temp) = x;
  - script.execute: printer_update_temps

- platform: homeassistant
  id: printer_ha_ext_target
  entity_id: ${ext_target}
  on_value:
  - lambda: if (!std::isnan(x)) id(printer_ext_target) = x;
  - script.execute: printer_update_temps

- platform: homeassistant
  id: printer_ha_bed_temp
  entity_id: ${bed_temp}
  on_value:
  - lambda: if (!std::isnan(x)) id(printer_bed_temp) = x;
  - script.execute: printer_update_temps

- platform: homeassistant
  id: printer_ha_bed_target
  entity_id: ${bed_target}
  on_value:
  - lambda: if (!std::isnan(x)) id(printer_bed_target) = x;
  - script.execute: printer_update_temps

script:
- id: printer_update_temps
  then:
  - lambda: |-
      lv_label_set_text(id(printer_ext_label),
        str_sprintf("%.0f° / %.0f°", id(printer_ext_temp), id(printer_ext_target)).c_str());
      lv_label_set_text(id(printer_bed_label),
        str_sprintf("%.0f° / %.0f°", id(printer_bed_temp), id(printer_bed_target)).c_str());

- id: printer_update_info
  then:
  - lambda: |-
      std::string eta = id(printer_eta);
      // tempo restante = ETA − agora (relógio do painel)
      std::string rest;
      if (eta.size() == 5 && eta[2] == ':') {
        auto now = id(system_time).now();
        if (now.is_valid()) {
          int eta_min = atoi(eta.substr(0, 2).c_str()) * 60 + atoi(eta.substr(3, 2).c_str());
          int now_min = now.hour * 60 + now.minute;
          int diff = eta_min - now_min;
          if (diff < 0) diff += 1440;
          if (diff > 0 && diff < 1440) {
            if (diff >= 60) rest = str_sprintf("Faltam %dh%02d", diff / 60, diff % 60);
            else            rest = str_sprintf("Faltam %d min", diff);
          }
        }
      }
      std::string info;
      if (!rest.empty()) {
        info = str_sprintf("%s  ·  Termina %s  ·  %.0f W", rest.c_str(), eta.c_str(), id(printer_watts));
      } else if (!eta.empty()) {
        info = str_sprintf("Termina %s  ·  %.0f W", eta.c_str(), id(printer_watts));
      } else {
        info = str_sprintf("%.0f W", id(printer_watts));
      }
      lv_label_set_text(id(printer_info_label), info.c_str());

# Reatualiza o "Faltam..." a cada minuto junto com o relógio
- id: !extend time_update
  then:
  - script.execute: printer_update_info
