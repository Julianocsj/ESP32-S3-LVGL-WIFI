---
# Página de consumo do Claude — barras de progresso de Sessão e Semana,
# horários de reset e ritmo da semana. Barra fica vermelha >= 90%.
#
# vars:
#   session_usage   sensor de uso da sessão (%)
#   week_usage      sensor de uso da semana (%)
#   session_reset   sensor timestamp do reset da sessão
#   weekly_reset    sensor timestamp do reset semanal
#   page_id         página de volta (default main_page)
#
# O marcador de ritmo e o veredito ("dura até o reset" / "estoura X antes")
# são calculados localmente por projeção linear — não usam o sensor de pace.

globals:
- id: cl_session_epoch
  type: long
  initial_value: '-1'
- id: cl_week_epoch
  type: long
  initial_value: '-1'
- id: cl_week_usage_g
  type: float
  initial_value: '-1.0'

lvgl:
  pages:
  - id: claude_page
    styles: page_style
    skip: true
    pad_all: 12
    layout:
      type: FLEX
      flex_flow: COLUMN
      flex_align_cross: CENTER
    widgets:
    # ── barra de topo ────────────────────────────────────────────────────────
    - obj:
        width: 100%
        height: 56
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollable: false
        scrollbar_mode: "OFF"
        widgets:
        - button:
            id: cl_btn_back
            align: LEFT_MID
            width: 50
            height: 50
            radius: 25
            bg_color: $tile_off_bg
            pad_all: 0
            on_short_click:
              then:
              - lvgl.page.show:
                  id: ${page_id | default("main_page")}
                  animation: OUT_RIGHT
                  time: 150ms
            widgets:
            - label:
                align: CENTER
                text_font: mdi_icons_28
                text_color: $tile_off_icon
                text: $mdi_chevron_left
        - label:
            align: CENTER
            text_font: $tile_name_font
            text_color: $tile_off_status
            text: "Claude"
    # ── corpo ────────────────────────────────────────────────────────────────
    - obj:
        width: 100%
        flex_grow: 1
        bg_opa: TRANSP
        border_width: 0
        pad_left: 16
        pad_right: 16
        pad_top: 0
        pad_bottom: 0
        scrollable: false
        scrollbar_mode: "OFF"
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: CENTER
          flex_align_cross: CENTER
          pad_row: 6
        widgets:
        # ── logo ───────────────────────────────────────────────────────────
        - image:
            src: claude_logo_lg
        # ── SESSÃO ─────────────────────────────────────────────────────────
        - obj:
            width: 100%
            height: 44
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
            - label:
                align: LEFT_MID
                text_font: $tile_name_font
                text_color: $tile_off_name
                text: "Sessão"
            - label:
                id: cl_session_pct
                align: RIGHT_MID
                text_font: nunito_36
                text_color: $tile_off_name
                text: "--%"
        - bar:
            id: cl_session_bar
            width: 100%
            height: 16
            radius: 8
            min_value: 0
            max_value: 100
            value: 0
            bg_color: $tile_off_bg
            indicator:
              bg_color: $tile_on_bg
        - label:
            id: cl_session_reset
            width: 100%
            text_align: LEFT
            text_font: $tile_status_font
            text_color: $tile_off_status
            text: ""
        # separador entre as seções
        - obj:
            width: 100%
            height: 14
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
        # ── SEMANA ─────────────────────────────────────────────────────────
        - obj:
            width: 100%
            height: 44
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
            - label:
                align: LEFT_MID
                text_font: $tile_name_font
                text_color: $tile_off_name
                text: "Semana"
            - label:
                id: cl_week_pct
                align: RIGHT_MID
                text_font: nunito_36
                text_color: $tile_off_name
                text: "--%"
        - bar:
            id: cl_week_bar
            width: 100%
            height: 16
            radius: 8
            min_value: 0
            max_value: 100
            value: 0
            bg_color: $tile_off_bg
            indicator:
              bg_color: $tile_on_bg
        - label:
            id: cl_week_reset
            width: 100%
            text_align: LEFT
            text_font: $tile_status_font
            text_color: $tile_off_status
            text: ""
        # ── RITMO (com respiro extra acima) ────────────────────────────────
        - obj:
            width: 100%
            height: 10
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
        - label:
            id: cl_pace_label
            width: 100%
            text_align: CENTER
            text_font: $tile_status_font
            text_color: $tile_off_status
            text: ""

# ── Estado vindo do HA ─────────────────────────────────────────────────────────
sensor:
- platform: homeassistant
  id: cl_ha_session
  entity_id: ${session_usage}
  on_value:
  - lambda: |-
      if (std::isnan(x)) return;
      lv_label_set_text(id(cl_session_pct), str_sprintf("%.0f%%", x).c_str());
      lv_bar_set_value(id(cl_session_bar), (int)x, LV_ANIM_ON);
      lv_obj_set_style_bg_color(id(cl_session_bar),
        lv_color_hex(x >= 90.0f ? 0xE24B4A : ${tile_on_bg}), LV_PART_INDICATOR);
      lv_obj_set_style_text_color(id(cl_session_pct),
        lv_color_hex(x >= 90.0f ? 0xE24B4A : ${tile_off_name}), 0);

- platform: homeassistant
  id: cl_ha_week
  entity_id: ${week_usage}
  on_value:
  - lambda: |-
      if (std::isnan(x)) return;
      id(cl_week_usage_g) = x;
      lv_label_set_text(id(cl_week_pct), str_sprintf("%.0f%%", x).c_str());
      lv_bar_set_value(id(cl_week_bar), (int)x, LV_ANIM_ON);
      lv_obj_set_style_bg_color(id(cl_week_bar),
        lv_color_hex(x >= 90.0f ? 0xE24B4A : ${tile_on_bg}), LV_PART_INDICATOR);
      lv_obj_set_style_text_color(id(cl_week_pct),
        lv_color_hex(x >= 90.0f ? 0xE24B4A : ${tile_off_name}), 0);
  - script.execute: cl_update_resets

text_sensor:
- platform: homeassistant
  id: cl_ha_session_reset
  entity_id: ${session_reset}
  on_value:
  - lambda: |-
      // ISO 8601 (com offset) -> epoch UTC
      std::string s = x;
      if (s.size() < 16 || s[10] != 'T') return;
      int Y = atoi(s.substr(0, 4).c_str()), M = atoi(s.substr(5, 2).c_str()), D = atoi(s.substr(8, 2).c_str());
      int h = atoi(s.substr(11, 2).c_str()), mi = atoi(s.substr(14, 2).c_str());
      int y = Y - (M <= 2);
      int era = (y >= 0 ? y : y - 399) / 400;
      unsigned yoe = (unsigned)(y - era * 400);
      unsigned doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
      unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
      long days = (long)era * 146097 + (long)doe - 719468;
      long epoch = days * 86400 + h * 3600L + mi * 60L;
      if (s.size() >= 22 && (s[19] == '+' || s[19] == '-')) {
        long off = atoi(s.substr(20, 2).c_str()) * 3600L + atoi(s.substr(23, 2).c_str()) * 60L;
        epoch += (s[19] == '-') ? off : -off;
      }
      id(cl_session_epoch) = epoch;
  - script.execute: cl_update_resets

- platform: homeassistant
  id: cl_ha_weekly_reset
  entity_id: ${weekly_reset}
  on_value:
  - lambda: |-
      std::string s = x;
      if (s.size() < 16 || s[10] != 'T') return;
      int Y = atoi(s.substr(0, 4).c_str()), M = atoi(s.substr(5, 2).c_str()), D = atoi(s.substr(8, 2).c_str());
      int h = atoi(s.substr(11, 2).c_str()), mi = atoi(s.substr(14, 2).c_str());
      int y = Y - (M <= 2);
      int era = (y >= 0 ? y : y - 399) / 400;
      unsigned yoe = (unsigned)(y - era * 400);
      unsigned doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
      unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
      long days = (long)era * 146097 + (long)doe - 719468;
      long epoch = days * 86400 + h * 3600L + mi * 60L;
      if (s.size() >= 22 && (s[19] == '+' || s[19] == '-')) {
        long off = atoi(s.substr(20, 2).c_str()) * 3600L + atoi(s.substr(23, 2).c_str()) * 60L;
        epoch += (s[19] == '-') ? off : -off;
      }
      id(cl_week_epoch) = epoch;
  - script.execute: cl_update_resets

script:
- id: cl_update_resets
  then:
  - lambda: |-
      auto now = id(system_time).now();
      if (!now.is_valid()) return;
      long nowe = (long)now.timestamp;
      // Sessão: sempre contagem regressiva
      if (id(cl_session_epoch) > 0) {
        long dm = (id(cl_session_epoch) - nowe) / 60;
        if (dm <= 0)
          lv_label_set_text(id(cl_session_reset), "Resetando...");
        else if (dm < 60)
          lv_label_set_text(id(cl_session_reset), str_sprintf("Reseta em %ldmin", dm).c_str());
        else
          lv_label_set_text(id(cl_session_reset), str_sprintf("Reseta em %ldh %ldmin", dm / 60, dm % 60).c_str());
      }
      // Semana: contagem regressiva a menos de 24h; senão, a data
      if (id(cl_week_epoch) > 0) {
        long dm = (id(cl_week_epoch) - nowe) / 60;
        if (dm <= 0)
          lv_label_set_text(id(cl_week_reset), "Resetando...");
        else if (dm < 60)
          lv_label_set_text(id(cl_week_reset), str_sprintf("Reseta em %ldmin", dm).c_str());
        else if (dm < 1440)
          lv_label_set_text(id(cl_week_reset), str_sprintf("Reseta em %ldh %ldmin", dm / 60, dm % 60).c_str());
        else {
          auto lt = ESPTime::from_epoch_local((time_t) id(cl_week_epoch));
          lv_label_set_text(id(cl_week_reset), str_sprintf("Reseta %02d/%02d", lt.day_of_month, lt.month).c_str());
        }
      }
      // ── Veredito da semana (projeção linear do gasto) ───────────────────
      if (id(cl_week_epoch) > 0) {
        long start = id(cl_week_epoch) - 604800L;   // semana de 7 dias
        float elapsed = (float)(nowe - start) / 604800.0f;
        if (elapsed < 0.0f) elapsed = 0.0f;
        if (elapsed > 1.0f) elapsed = 1.0f;
        float u = id(cl_week_usage_g);
        if (u >= 0.0f) {
          std::string verdict;
          uint32_t vcol = ${tile_off_status};
          if (elapsed < 0.05f) {
            verdict = "Semana recém-iniciada";
          } else if (u < 0.5f) {
            verdict = "No ritmo atual, dura até o reset";
          } else {
            long bust = start + (long)((nowe - start) * (100.0f / u));
            if (bust >= id(cl_week_epoch)) {
              verdict = "No ritmo atual, dura até o reset";
            } else {
              long early_min = (id(cl_week_epoch) - bust) / 60;  // sempre positivo
              std::string span;
              if (early_min >= 1440) {
                long dias = early_min / 1440;
                span = str_sprintf("%ld dia%s", dias, dias > 1 ? "s" : "");
              } else if (early_min >= 60) {
                span = str_sprintf("%ldh", early_min / 60);
              } else {
                span = str_sprintf("%ldmin", early_min);
              }
              verdict = str_sprintf("No ritmo atual, estoura %s antes do reset", span.c_str());
              vcol = (early_min >= 1440) ? 0xE24B4A : 0xF4A900;
            }
          }
          lv_label_set_text(id(cl_pace_label), verdict.c_str());
          lv_obj_set_style_text_color(id(cl_pace_label), lv_color_hex(vcol), 0);
        }
      }

# Reatualiza a contagem a cada minuto junto com o relógio
- id: !extend time_update
  then:
  - script.execute: cl_update_resets
