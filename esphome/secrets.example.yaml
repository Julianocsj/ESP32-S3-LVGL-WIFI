---
# COPIE ESTE ARQUIVO PARA "secrets.yaml" E PREENCHA COM OS SEUS DADOS.
# Nunca compartilhe o secrets.yaml preenchido — ele tem a senha do seu Wi-Fi.

# Rede Wi-Fi de 2.4 GHz. O ESP32-S3 NÃO enxerga rede 5 GHz.
# Se o seu roteador usa o mesmo nome nas duas bandas normalmente funciona,
# mas se der problema de conexão, separe as bandas ou crie uma rede de IoT.
wifi_ssid: "NOME_DA_SUA_REDE"
wifi_password: "SENHA_DA_SUA_REDE"

# Senha do hotspot de emergência que o painel cria se não conseguir conectar.
ap_password: "painel1234"

# Senha do OTA. Opcional — vem comentada no ota.yaml do repo.
ota_password: "painel1234"

# Coordenadas da sua cidade. Usadas SÓ para o brilho automático seguir o
# nascer e o pôr do sol. Pegue no Google Maps (clique com o botão direito
# no local > o primeiro item do menu são as coordenadas).
latitude: "-23.5505"
longitude: "-46.6333"
