---
# Tile de navegação — abre outra página. Não controla nada no HA.
#
# vars:
#   uid, target_page, row, column, text, icon
#   page_id   (default main_page)
#   subtitle  (default "")

lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - button:
        id: button_${uid}
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_x_align: STRETCH
        grid_cell_y_align: STRETCH
        radius: 18
        bg_color: $tile_off_bg
        pad_all: 4
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: CENTER
          flex_align_cross: CENTER
          pad_row: 2
        widgets:
        - label:
            width: 100%
            text_align: CENTER
            text_font: $tile_icon_font
            text_color: $tile_off_icon
            text: ${icon}
        - label:
            width: 100%
            text_align: CENTER
            text_font: $tile_name_font
            text_color: $tile_off_name
            text: ${text}
        - label:
            width: 100%
            text_align: CENTER
            text_font: $tile_status_font
            text_color: $tile_off_status
            text: ${subtitle | default(" ")}
        on_short_click:
          then:
          - lvgl.page.show:
              id: ${target_page}
              animation: OVER_LEFT
              time: 150ms
