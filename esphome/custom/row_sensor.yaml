---
# Linha SOMENTE LEITURA de um sensor numérico (temperatura, potência, energia).
# Para páginas em FLEX COLUMN — não usa posição de grade.
#
# A unidade entra por concatenação de string, e não pelo format do sprintf,
# porque unidades como "%" quebrariam o format ("%%" seria obrigatório).
#
# vars:
#   uid, entity_id, page_id, text, icon
#   unit      (default "")
#   decimals  (default 1)
#   height    (default 62)

lvgl:
  pages:
  - id: !extend ${page_id}
    widgets:
    - obj:
        id: row_${uid}
        width: 100%
        height: ${height | default(62)}
        radius: 16
        bg_color: $tile_off_bg
        bg_opa: COVER
        border_width: 0
        pad_left: 16
        pad_right: 16
        pad_top: 0
        pad_bottom: 0
        scrollable: false
        scrollbar_mode: "OFF"
        widgets:
        - label:
            align: LEFT_MID
            text_font: $row_icon_font
            text_color: $tile_off_icon
            text: ${icon}
        - label:
            align: LEFT_MID
            x: 48
            text_font: $row_name_font
            text_color: $tile_off_name
            text: ${text}
        - label:
            id: value_${uid}
            align: RIGHT_MID
            text_font: $row_value_font
            text_color: $tile_off_name
            text: "--"

sensor:
- platform: homeassistant
  id: ${uid}_ha_state
  entity_id: ${entity_id}
  on_value:
  - lambda: |-
      if (std::isnan(x)) {
        lv_label_set_text(id(value_${uid}), "--");
        return;
      }
      std::string s = str_sprintf("%.${decimals | default(1)}f", x) + " ${unit | default("")}";
      lv_label_set_text(id(value_${uid}), s.c_str());
