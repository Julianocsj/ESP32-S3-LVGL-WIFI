---
# Linha de configuração com interruptor — para páginas de ajustes (ex.: sensores).
# A linha inteira é clicável e alterna a entidade; à direita, um indicador
# estilo switch desliza e acende quando ativo.
#
# vars:
#   uid, entity_id, row, text, icon
#   page_id     (default main_page)
#   status_on   (default "Ativo")
#   status_off  (default "Inativo")

globals:
- id: ${uid}_is_on
  type: bool
  initial_value: 'false'

lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - button:
        id: button_${uid}
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: 0
        grid_cell_x_align: STRETCH
        grid_cell_y_align: STRETCH
        radius: 18
        bg_color: $tile_off_bg
        pad_left: 20
        pad_right: 20
        pad_top: 0
        pad_bottom: 0
        widgets:
        - label:
            id: icon_${uid}
            align: LEFT_MID
            text_font: $tile_icon_font
            text_color: $tile_off_icon
            text: ${icon}
        - label:
            id: name_${uid}
            align: LEFT_MID
            x: 62
            y: -13
            text_font: $tile_name_font
            text_color: $tile_off_name
            text: ${text}
        - label:
            id: status_${uid}
            align: LEFT_MID
            x: 62
            y: 14
            text_font: $tile_status_font
            text_color: $tile_off_status
            text: ${status_off | default("Inativo")}
        # interruptor visual (indicador; o clique é da linha toda)
        - obj:
            id: tgl_${uid}
            align: RIGHT_MID
            width: 56
            height: 32
            radius: 16
            bg_color: 0x3A2E22
            bg_opa: COVER
            border_width: 0
            pad_all: 4
            scrollable: false
            scrollbar_mode: "OFF"
            clickable: false
            widgets:
            - obj:
                id: knob_${uid}
                width: 24
                height: 24
                radius: 12
                bg_color: 0x8A7F74
                bg_opa: COVER
                border_width: 0
                pad_all: 0
                scrollable: false
                scrollbar_mode: "OFF"
                align: LEFT_MID
        on_short_click:
          then:
          - homeassistant.action:
              action: homeassistant.toggle
              data:
                entity_id: ${entity_id}

binary_sensor:
- platform: homeassistant
  id: ${uid}_ha_state
  entity_id: ${entity_id}
  trigger_on_initial_state: true
  on_state:
  - lambda: id(${uid}_is_on) = x;
  - script.execute: ${uid}_sync

script:
- id: ${uid}_sync
  then:
  - lambda: |-
      bool on = id(${uid}_is_on);
      lv_obj_set_style_text_color(id(icon_${uid}),
        lv_color_hex(on ? ${tile_on_bg} : ${tile_off_icon}), 0);
      lv_label_set_text(id(status_${uid}),
        on ? "${status_on | default("Ativo")}" : "${status_off | default("Inativo")}");
      lv_obj_set_style_text_color(id(status_${uid}),
        lv_color_hex(on ? ${tile_on_bg} : ${tile_off_status}), 0);
      lv_obj_set_style_bg_color(id(tgl_${uid}),
        lv_color_hex(on ? ${tile_on_bg} : 0x3A2E22), 0);
      lv_obj_set_style_bg_color(id(knob_${uid}),
        lv_color_hex(on ? ${tile_on_fg} : 0x8A7F74), 0);
      lv_obj_set_align(id(knob_${uid}), on ? LV_ALIGN_RIGHT_MID : LV_ALIGN_LEFT_MID);
