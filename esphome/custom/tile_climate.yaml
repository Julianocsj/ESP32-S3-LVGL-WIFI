---
# Tile flat de climate (ar-condicionado) + página de detalhe com modos.
# Tile: resumo "23° · Amb 25°", cor segue o modo (frio azul, quente vermelho,
# auto laranja, desligado grafite). Toque abre o detalhe.
# Detalhe: setpoint +/− grande, temperatura ambiente, chips Auto/Frio/Quente/Off.
#
# vars:
#   uid, entity_id, row, column, text, icon
#   room_sensor   entidade de temperatura ambiente (sensor.*)
#   page_id       (default main_page)
#   min_temp      (default 16)
#   max_temp      (default 30)

globals:
- id: ${uid}_setpoint
  type: float
  initial_value: '23.0'
- id: ${uid}_room
  type: float
  initial_value: '0.0'
- id: ${uid}_is_on
  type: bool
  initial_value: 'false'
- id: ${uid}_mode
  type: std::string
  initial_value: '"off"'

lvgl:
  pages:
  # ── TILE na grade ────────────────────────────────────────────────────────────
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - button:
        id: button_${uid}
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_x_align: STRETCH
        grid_cell_y_align: STRETCH
        radius: 18
        bg_color: $tile_off_bg
        pad_all: 4
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: CENTER
          flex_align_cross: CENTER
          pad_row: 2
        widgets:
        - label:
            id: icon_${uid}
            width: 100%
            text_align: CENTER
            text_font: $tile_icon_font
            text_color: $tile_off_icon
            text: ${icon}
        - label:
            id: name_${uid}
            width: 100%
            text_align: CENTER
            text_font: $tile_name_font
            text_color: $tile_off_name
            text: ${text}
        - label:
            id: status_${uid}
            width: 100%
            text_align: CENTER
            text_font: $tile_status_font
            text_color: $tile_off_status
            text: "Desligado"
        on_short_click:
          then:
          - lvgl.page.show:
              id: ${uid}_detail_page
              animation: OVER_LEFT
              time: 150ms

  # ── PÁGINA DE DETALHE ────────────────────────────────────────────────────────
  - id: ${uid}_detail_page
    styles: page_style
    skip: true
    pad_all: 12
    layout:
      type: FLEX
      flex_flow: COLUMN
      flex_align_cross: CENTER
    widgets:
    - obj:
        width: 100%
        height: 56
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollable: false
        scrollbar_mode: "OFF"
        widgets:
        - button:
            id: ${uid}_btn_back
            align: LEFT_MID
            width: 50
            height: 50
            radius: 25
            bg_color: $tile_off_bg
            pad_all: 0
            on_short_click:
              then:
              - lvgl.page.show:
                  id: ${page_id | default("main_page")}
                  animation: OUT_RIGHT
                  time: 150ms
            widgets:
            - label:
                align: CENTER
                text_font: mdi_icons_28
                text_color: $tile_off_icon
                text: $mdi_chevron_left
        - label:
            align: CENTER
            text_font: $tile_name_font
            text_color: $tile_off_status
            text: ${text}
    - obj:
        width: 100%
        flex_grow: 1
        bg_opa: TRANSP
        border_width: 0
        scrollable: false
        scrollbar_mode: "OFF"
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: CENTER
          flex_align_cross: CENTER
          pad_row: 18
        widgets:
        # setpoint com +/-
        - obj:
            width: 100%
            height: 100
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 26
            widgets:
            - button:
                id: ${uid}_btn_minus
                width: 64
                height: 64
                radius: 32
                bg_color: $tile_off_bg
                pad_all: 0
                on_short_click:
                  then:
                  - lambda: |-
                      float t = id(${uid}_setpoint) - 1.0f;
                      if (t < ${min_temp | default(16)}) t = ${min_temp | default(16)};
                      id(${uid}_setpoint) = t;
                  - script.execute: ${uid}_send_setpoint
                  - script.execute: ${uid}_sync
                widgets:
                - label:
                    align: CENTER
                    text_font: mdi_icons_24
                    text_color: $tile_off_name
                    text: $mdi_minus
            - label:
                id: ${uid}_setpoint_label
                text_font: nunito_48
                text_color: $tile_off_name
                text: "23°"
            - button:
                id: ${uid}_btn_plus
                width: 64
                height: 64
                radius: 32
                bg_color: $tile_off_bg
                pad_all: 0
                on_short_click:
                  then:
                  - lambda: |-
                      float t = id(${uid}_setpoint) + 1.0f;
                      if (t > ${max_temp | default(30)}) t = ${max_temp | default(30)};
                      id(${uid}_setpoint) = t;
                  - script.execute: ${uid}_send_setpoint
                  - script.execute: ${uid}_sync
                widgets:
                - label:
                    align: CENTER
                    text_font: mdi_icons_24
                    text_color: $tile_off_name
                    text: $mdi_plus
        # temperatura ambiente
        - label:
            id: ${uid}_room_label
            text_font: $tile_name_font
            text_color: $tile_off_status
            text: "Ambiente --°"
        # chips de modo (ícone + texto)
        - obj:
            width: 100%
            height: 72
            bg_opa: TRANSP
            border_width: 0
            pad_left: 4
            pad_right: 4
            pad_top: 0
            pad_bottom: 0
            scrollable: false
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
              pad_column: 8
            widgets:
            - button:
                id: ${uid}_chip_auto
                flex_grow: 1
                height: 66
                radius: 16
                bg_color: $tile_off_bg
                pad_all: 0
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  pad_row: 2
                on_short_click:
                  then:
                  - lambda: |-
                      id(${uid}_mode) = "heat_cool";
                      id(${uid}_is_on) = true;
                  - homeassistant.action:
                      action: climate.set_hvac_mode
                      data:
                        entity_id: ${entity_id}
                        hvac_mode: heat_cool
                  - script.execute: ${uid}_sync
                widgets:
                - label:
                    id: ${uid}_chip_auto_ic
                    width: 100%
                    text_align: CENTER
                    text_font: mdi_icons_24
                    text_color: $tile_off_status
                    text: $mdi_autorenew
                - label:
                    id: ${uid}_chip_auto_lb
                    width: 100%
                    text_align: CENTER
                    text_font: $tile_status_font
                    text_color: $tile_off_status
                    text: "Auto"
            - button:
                id: ${uid}_chip_cool
                flex_grow: 1
                height: 66
                radius: 16
                bg_color: $tile_off_bg
                pad_all: 0
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  pad_row: 2
                on_short_click:
                  then:
                  - lambda: |-
                      id(${uid}_mode) = "cool";
                      id(${uid}_is_on) = true;
                  - homeassistant.action:
                      action: climate.set_hvac_mode
                      data:
                        entity_id: ${entity_id}
                        hvac_mode: cool
                  - script.execute: ${uid}_sync
                widgets:
                - label:
                    id: ${uid}_chip_cool_ic
                    width: 100%
                    text_align: CENTER
                    text_font: mdi_icons_24
                    text_color: $tile_off_status
                    text: $mdi_snowflake
                - label:
                    id: ${uid}_chip_cool_lb
                    width: 100%
                    text_align: CENTER
                    text_font: $tile_status_font
                    text_color: $tile_off_status
                    text: "Frio"
            - button:
                id: ${uid}_chip_heat
                flex_grow: 1
                height: 66
                radius: 16
                bg_color: $tile_off_bg
                pad_all: 0
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  pad_row: 2
                on_short_click:
                  then:
                  - lambda: |-
                      id(${uid}_mode) = "heat";
                      id(${uid}_is_on) = true;
                  - homeassistant.action:
                      action: climate.set_hvac_mode
                      data:
                        entity_id: ${entity_id}
                        hvac_mode: heat
                  - script.execute: ${uid}_sync
                widgets:
                - label:
                    id: ${uid}_chip_heat_ic
                    width: 100%
                    text_align: CENTER
                    text_font: mdi_icons_24
                    text_color: $tile_off_status
                    text: $mdi_fire
                - label:
                    id: ${uid}_chip_heat_lb
                    width: 100%
                    text_align: CENTER
                    text_font: $tile_status_font
                    text_color: $tile_off_status
                    text: "Quente"
            - button:
                id: ${uid}_chip_off
                flex_grow: 1
                height: 66
                radius: 16
                bg_color: $tile_off_bg
                pad_all: 0
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  pad_row: 2
                on_short_click:
                  then:
                  - lambda: |-
                      id(${uid}_mode) = "off";
                      id(${uid}_is_on) = false;
                  - homeassistant.action:
                      action: climate.turn_off
                      data:
                        entity_id: ${entity_id}
                  - script.execute: ${uid}_sync
                widgets:
                - label:
                    id: ${uid}_chip_off_ic
                    width: 100%
                    text_align: CENTER
                    text_font: mdi_icons_24
                    text_color: $tile_off_status
                    text: $mdi_power
                - label:
                    id: ${uid}_chip_off_lb
                    width: 100%
                    text_align: CENTER
                    text_font: $tile_status_font
                    text_color: $tile_off_status
                    text: "Desligado"

# ── Estado vindo do HA ─────────────────────────────────────────────────────────
text_sensor:
- platform: homeassistant
  id: ${uid}_ha_mode
  entity_id: ${entity_id}
  on_value:
  - lambda: |-
      id(${uid}_mode) = x;
      id(${uid}_is_on) = (x != "off" && x != "unavailable" && x != "unknown");
  - script.execute: ${uid}_sync

sensor:
- platform: homeassistant
  id: ${uid}_ha_setpoint
  entity_id: ${entity_id}
  attribute: temperature
  on_value:
  - lambda: if (!std::isnan(x)) id(${uid}_setpoint) = x;
  - script.execute: ${uid}_sync

- platform: homeassistant
  id: ${uid}_ha_room
  entity_id: ${room_sensor}
  on_value:
  - lambda: if (!std::isnan(x)) id(${uid}_room) = x;
  - script.execute: ${uid}_sync

script:
- id: ${uid}_send_setpoint
  then:
  - homeassistant.action:
      action: climate.set_temperature
      data:
        entity_id: ${entity_id}
        temperature: !lambda 'return str_sprintf("%.0f", id(${uid}_setpoint));'

- id: ${uid}_sync
  then:
  - lambda: |-
      std::string m = id(${uid}_mode);
      bool on = id(${uid}_is_on);

      // Cor do modo: frio azul, quente vermelho, auto laranja, off grafite
      uint32_t mode_bg = ${tile_off_bg};
      uint32_t mode_fg = ${tile_off_name};
      if (m == "cool")                          { mode_bg = 0x3FA7F3; mode_fg = 0x082A40; }
      else if (m == "heat")                     { mode_bg = 0xE24B4A; mode_fg = 0x3F0F0D; }
      else if (m == "heat_cool" || m == "auto") { mode_bg = ${tile_on_bg}; mode_fg = ${tile_on_fg}; }

      // Detalhe: setpoint + ambiente
      lv_label_set_text(id(${uid}_setpoint_label),
        str_sprintf("%.0f°", id(${uid}_setpoint)).c_str());
      if (id(${uid}_room) > 0.0f) {
        lv_label_set_text(id(${uid}_room_label),
          str_sprintf("Ambiente %.1f°", id(${uid}_room)).c_str());
      }

      // Tile: cor + resumo
      lv_obj_set_style_bg_color(id(button_${uid}), lv_color_hex(on ? mode_bg : ${tile_off_bg}), 0);
      lv_obj_set_style_text_color(id(icon_${uid}), lv_color_hex(on ? mode_fg : ${tile_off_icon}), 0);
      lv_obj_set_style_text_color(id(name_${uid}), lv_color_hex(on ? mode_fg : ${tile_off_name}), 0);
      lv_obj_set_style_text_color(id(status_${uid}), lv_color_hex(on ? mode_fg : ${tile_off_status}), 0);
      if (on) {
        if (id(${uid}_room) > 0.0f) {
          lv_label_set_text(id(status_${uid}),
            str_sprintf("%.0f° · Amb %.0f°", id(${uid}_setpoint), id(${uid}_room)).c_str());
        } else {
          lv_label_set_text(id(status_${uid}),
            str_sprintf("%.0f°", id(${uid}_setpoint)).c_str());
        }
      } else {
        lv_label_set_text(id(status_${uid}), "Desligado");
      }

      // Chips: realce do modo ativo (fundo + ícone + texto)
      struct Chip { lv_obj_t* btn; lv_obj_t* ic; lv_obj_t* lb; bool sel; uint32_t bg; uint32_t fg; };
      Chip chips[] = {
        { id(${uid}_chip_auto), id(${uid}_chip_auto_ic), id(${uid}_chip_auto_lb), (m == "heat_cool" || m == "auto"), ${tile_on_bg}, ${tile_on_fg} },
        { id(${uid}_chip_cool), id(${uid}_chip_cool_ic), id(${uid}_chip_cool_lb), (m == "cool"), 0x3FA7F3, 0x082A40 },
        { id(${uid}_chip_heat), id(${uid}_chip_heat_ic), id(${uid}_chip_heat_lb), (m == "heat"), 0xE24B4A, 0x3F0F0D },
        { id(${uid}_chip_off),  id(${uid}_chip_off_ic),  id(${uid}_chip_off_lb),  (!on),         0x8A7F74, 0x1A1613 },
      };
      for (auto &c : chips) {
        lv_obj_set_style_bg_color(c.btn, lv_color_hex(c.sel ? c.bg : ${tile_off_bg}), 0);
        lv_obj_set_style_text_color(c.ic, lv_color_hex(c.sel ? c.fg : ${tile_off_status}), 0);
        lv_obj_set_style_text_color(c.lb, lv_color_hex(c.sel ? c.fg : ${tile_off_status}), 0);
      }
