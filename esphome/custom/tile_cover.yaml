---
# Tile flat de persiana (cover) + página de detalhe.
# Tile: toque = alterna abrir/fechar · SEGURAR = abre o detalhe.
# Detalhe: botões ▲ ■ ▼ grandes + slider de posição (%).
# O tile fica grafite sempre; status em texto, laranja durante o movimento.
#
# vars:
#   uid, entity_id, row, column, text, icon
#   page_id (default main_page)

lvgl:
  pages:
  # ── TILE na grade ────────────────────────────────────────────────────────────
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - button:
        id: button_${uid}
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_x_align: STRETCH
        grid_cell_y_align: STRETCH
        radius: 18
        bg_color: $tile_off_bg
        pad_all: 4
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: CENTER
          flex_align_cross: CENTER
          pad_row: 2
        widgets:
        - label:
            id: icon_${uid}
            width: 100%
            text_align: CENTER
            text_font: $tile_icon_font
            text_color: $tile_off_icon
            text: ${icon}
        - label:
            id: name_${uid}
            width: 100%
            text_align: CENTER
            text_font: $tile_name_font
            text_color: $tile_off_name
            text: ${text}
        - label:
            id: status_${uid}
            width: 100%
            text_align: CENTER
            text_font: $tile_status_font
            text_color: $tile_off_status
            text: "..."
        on_short_click:
          then:
          - homeassistant.action:
              action: cover.toggle
              data:
                entity_id: ${entity_id}
        on_long_press:
          then:
          - lvgl.page.show:
              id: ${uid}_detail_page
              animation: OVER_LEFT
              time: 150ms

  # ── PÁGINA DE DETALHE ────────────────────────────────────────────────────────
  - id: ${uid}_detail_page
    styles: page_style
    skip: true
    pad_all: 12
    layout:
      type: FLEX
      flex_flow: COLUMN
      flex_align_cross: CENTER
    widgets:
    - obj:
        width: 100%
        height: 56
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollable: false
        scrollbar_mode: "OFF"
        widgets:
        - button:
            id: ${uid}_btn_back
            align: LEFT_MID
            width: 50
            height: 50
            radius: 25
            bg_color: $tile_off_bg
            pad_all: 0
            on_short_click:
              then:
              - lvgl.page.show:
                  id: ${page_id | default("main_page")}
                  animation: OUT_RIGHT
                  time: 150ms
            widgets:
            - label:
                align: CENTER
                text_font: mdi_icons_28
                text_color: $tile_off_icon
                text: $mdi_chevron_left
        - label:
            align: CENTER
            text_font: $tile_name_font
            text_color: $tile_off_status
            text: ${text}
    - obj:
        width: 100%
        flex_grow: 1
        bg_opa: TRANSP
        border_width: 0
        scrollable: false
        scrollbar_mode: "OFF"
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: CENTER
          flex_align_cross: CENTER
          pad_row: 20
        widgets:
        # abrir / parar / fechar
        - obj:
            width: 100%
            height: 90
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 24
            widgets:
            - button:
                id: ${uid}_btn_open
                width: 76
                height: 76
                radius: 38
                bg_color: $tile_off_bg
                pad_all: 0
                on_short_click:
                  then:
                  - homeassistant.action:
                      action: cover.open_cover
                      data:
                        entity_id: ${entity_id}
                widgets:
                - label:
                    align: CENTER
                    text_font: mdi_icons_40
                    text_color: $tile_off_name
                    text: $mdi_arrow_up
            - button:
                id: ${uid}_btn_stop
                width: 76
                height: 76
                radius: 38
                bg_color: $tile_off_bg
                pad_all: 0
                on_short_click:
                  then:
                  - homeassistant.action:
                      action: cover.stop_cover
                      data:
                        entity_id: ${entity_id}
                widgets:
                - label:
                    align: CENTER
                    text_font: mdi_icons_40
                    text_color: $tile_off_name
                    text: $mdi_stop
            - button:
                id: ${uid}_btn_close
                width: 76
                height: 76
                radius: 38
                bg_color: $tile_off_bg
                pad_all: 0
                on_short_click:
                  then:
                  - homeassistant.action:
                      action: cover.close_cover
                      data:
                        entity_id: ${entity_id}
                widgets:
                - label:
                    align: CENTER
                    text_font: mdi_icons_40
                    text_color: $tile_off_name
                    text: $mdi_arrow_down
        # posição
        - label:
            id: ${uid}_pos_label
            text_font: nunito_42
            text_color: $tile_off_name
            text: "--%"
        - obj:
            width: 100%
            height: 44
            bg_opa: TRANSP
            border_width: 0
            pad_left: 40
            pad_right: 40
            pad_top: 0
            pad_bottom: 0
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
            - slider:
                id: ${uid}_pos_slider
                align: CENTER
                width: 100%
                min_value: 0
                max_value: 100
                value: 0
                bg_color: $tile_off_bg
                indicator:
                  bg_color: $tile_on_bg
                knob:
                  bg_color: $tile_on_bg
                on_release:
                  then:
                  - homeassistant.action:
                      action: cover.set_cover_position
                      data:
                        entity_id: ${entity_id}
                        position: !lambda 'return str_sprintf("%d", (int)x);'
        - label:
            id: ${uid}_detail_status
            text_font: $tile_status_font
            text_color: $tile_off_status
            text: "..."

# ── Estado vindo do HA ─────────────────────────────────────────────────────────
text_sensor:
- platform: homeassistant
  id: ${uid}_ha_state
  entity_id: ${entity_id}
  on_value:
  - lambda: |-
      std::string s = x;
      std::string label;
      bool moving = false;
      if (s == "open")         { label = "Aberta"; }
      else if (s == "closed")  { label = "Fechada"; }
      else if (s == "opening") { label = "Abrindo..."; moving = true; }
      else if (s == "closing") { label = "Fechando..."; moving = true; }
      else                     { label = s; }
      lv_label_set_text(id(status_${uid}), label.c_str());
      lv_label_set_text(id(${uid}_detail_status), label.c_str());
      lv_obj_set_style_text_color(id(status_${uid}),
        lv_color_hex(moving ? ${tile_on_bg} : ${tile_off_status}), 0);
      lv_obj_set_style_text_color(id(${uid}_detail_status),
        lv_color_hex(moving ? ${tile_on_bg} : ${tile_off_status}), 0);
      lv_obj_set_style_text_color(id(icon_${uid}),
        lv_color_hex(moving ? ${tile_on_bg} : ${tile_off_icon}), 0);

# Posição (%): atualiza slider + rótulo
sensor:
- platform: homeassistant
  id: ${uid}_ha_pos
  entity_id: ${entity_id}
  attribute: current_position
  on_value:
  - lambda: |-
      if (std::isnan(x)) return;
      lv_label_set_text(id(${uid}_pos_label),
        str_sprintf("%d%%", (int)x).c_str());
  - lvgl.slider.update:
      id: ${uid}_pos_slider
      value: !lambda 'return (int)x;'
