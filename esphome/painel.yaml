    # ── TELA (brilho, timeout, desligar) ──────────────────────────────────────
    - id: brightness_page
      styles: page_style
      skip: true
      pad_all: 12
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_cross: CENTER
      widgets:
        - obj:
            width: 100%
            height: 56
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - button:
                  id: btn_back_bright
                  align: LEFT_MID
                  width: 50
                  height: 50
                  radius: 25
                  bg_color: 0x241E17
                  pad_all: 0
                  on_short_click:
                    then:
                      - lvgl.page.show:
                          id: main_page
                          animation: OUT_RIGHT
                          time: 150ms
                  widgets:
                    - label:
                        align: CENTER
                        text_font: mdi_icons_28
                        text_color: 0x8A7F74
                        text: $mdi_chevron_left
              - label:
                  align: CENTER
                  text_font: nunito_20
                  text_color: 0x8A7F74
                  text: "Tela"
        - obj:
            width: 100%
            flex_grow: 1
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 16
            widgets:
              - obj:
                  width: 100%
                  height: 44
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 8
                  pad_right: 8
                  pad_top: 0
                  pad_bottom: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        align: LEFT_MID
                        text_font: nunito_20
                        text_color: 0xD8CEC3
                        text: "Brilho"
                    - label:
                        id: brightness_pct_label
                        align: RIGHT_MID
                        text_font: nunito_36
                        text_color: 0xD8CEC3
                        text: "80%"
              - obj:
                  width: 100%
                  height: 44
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 16
                  pad_right: 16
                  pad_top: 0
                  pad_bottom: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  widgets:
                    - slider:
                        id: brightness_slider
                        align: CENTER
                        width: 100%
                        min_value: 10
                        max_value: 100
                        value: 80
                        bg_color: 0x241E17
                        indicator:
                          bg_color: 0xF37320
                        knob:
                          bg_color: 0xF37320
                        on_value:
                          then:
                            - light.turn_on:
                                id: display_backlight
                                brightness: !lambda 'return x / 100.0f;'
                                transition_length: 0s
                            - lvgl.label.update:
                                id: brightness_pct_label
                                text: !lambda 'return str_sprintf("%d%%", (int)x);'
              - obj:
                  width: 100%
                  height: 12
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
              - label:
                  width: 100%
                  text_align: LEFT
                  text_font: nunito_14
                  text_color: 0x8A7F74
                  text: "Desligar após"
              - obj:
                  width: 100%
                  height: 52
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 4
                  pad_right: 4
                  pad_top: 0
                  pad_bottom: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_EVENLY
                    flex_align_cross: CENTER
                    pad_column: 8
                  widgets:
                    - button:
                        id: tmo_chip_1
                        flex_grow: 1
                        height: 46
                        radius: 23
                        bg_color: 0x241E17
                        pad_all: 0
                        on_short_click:
                          then:
                            - number.set: {id: display_backlight_timeout, value: 1}
                            - script.execute: tela_sync_timeout
                        widgets:
                          - label: {id: tmo_lb_1, align: CENTER, text_font: nunito_14, text_color: 0x8A7F74, text: "1 min"}
                    - button:
                        id: tmo_chip_5
                        flex_grow: 1
                        height: 46
                        radius: 23
                        bg_color: 0x241E17
                        pad_all: 0
                        on_short_click:
                          then:
                            - number.set: {id: display_backlight_timeout, value: 5}
                            - script.execute: tela_sync_timeout
                        widgets:
                          - label: {id: tmo_lb_5, align: CENTER, text_font: nunito_14, text_color: 0x8A7F74, text: "5 min"}
                    - button:
                        id: tmo_chip_10
                        flex_grow: 1
                        height: 46
                        radius: 23
                        bg_color: 0x241E17
                        pad_all: 0
                        on_short_click:
                          then:
                            - number.set: {id: display_backlight_timeout, value: 10}
                            - script.execute: tela_sync_timeout
                        widgets:
                          - label: {id: tmo_lb_10, align: CENTER, text_font: nunito_14, text_color: 0x8A7F74, text: "10 min"}
                    - button:
                        id: tmo_chip_30
                        flex_grow: 1
                        height: 46
                        radius: 23
                        bg_color: 0x241E17
                        pad_all: 0
                        on_short_click:
                          then:
                            - number.set: {id: display_backlight_timeout, value: 30}
                            - script.execute: tela_sync_timeout
                        widgets:
                          - label: {id: tmo_lb_30, align: CENTER, text_font: nunito_14, text_color: 0x8A7F74, text: "30 min"}
                    - button:
                        id: tmo_chip_never
                        flex_grow: 1
                        height: 46
                        radius: 23
                        bg_color: 0x241E17
                        pad_all: 0
                        on_short_click:
                          then:
                            - number.set: {id: display_backlight_timeout, value: -1}
                            - script.execute: tela_sync_timeout
                        widgets:
                          - label: {id: tmo_lb_never, align: CENTER, text_font: nunito_14, text_color: 0x8A7F74, text: "Nunca"}
              - obj:
                  width: 100%
                  height: 12
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
              - button:
                  id: btn_screen_off
                  width: 260
                  height: 54
                  radius: 27
                  bg_color: 0x241E17
                  pad_all: 0
                  on_short_click:
                    then:
                      - light.turn_off: display_backlight
                      - lvgl.pause:
                          show_snow: false
                  widgets:
                    - label:
                        align: CENTER
                        x: -86
                        text_font: mdi_icons_24
                        text_color: 0xE24B4A
                        text: $mdi_power
                    - label:
                        align: CENTER
                        x: 14
                        text_font: nunito_20
                        text_color: 0xD8CEC3
                        text: "Desligar a tela"

    # info_screen existe (labels do sensors_base) mas sai do swipe e do acesso
    - id: !extend info_screen
      skip: true

